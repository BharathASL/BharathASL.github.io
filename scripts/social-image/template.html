<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Social preview</title>
    <!-- Rendered at 1200x630 by render.mjs. Colours match the dark theme tokens in src/styles/tokens.css. -->
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        src: url('../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 300 700;
      }
      @font-face {
        font-family: 'Inter';
        src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0b0b0f;
        color: #f5f5f7;
        font-family: 'Inter', sans-serif;
      }
      .card {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 420px;
        width: 100%;
        height: 100%;
        padding: 72px 64px 64px 80px;
        background:
          radial-gradient(circle at 82% 45%, rgb(96 165 250 / 30%), transparent 42%),
          radial-gradient(circle at 0% 100%, rgb(96 165 250 / 12%), transparent 40%),
          linear-gradient(rgb(42 42 53 / 45%) 1px, transparent 1px) 0 0 / 48px 48px,
          linear-gradient(90deg, rgb(42 42 53 / 45%) 1px, transparent 1px) 0 0 / 48px 48px,
          #0b0b0f;
      }
      .text {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .label {
        margin: 0 0 20px;
        color: #60a5fa;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 124px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.035em;
      }
      .tagline {
        max-width: 560px;
        margin: 28px 0 0;
        color: #c4c4cc;
        font-size: 34px;
        line-height: 1.3;
      }
      .footer {
        display: flex;
        align-items: center;
        gap: 18px;
        color: #a1a1aa;
        font-size: 26px;
        font-weight: 500;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #f5f5f7;
        color: #0b0b0f;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .character {
        align-self: center;
        justify-self: center;
        height: 470px;
        filter: drop-shadow(0 30px 40px rgb(0 0 0 / 45%));
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text">
        <div>
          <p class="label">Full-Stack Developer</p>
          <h1>Bharath S</h1>
          <p class="tagline">I build software across web, cloud, data and Android.</p>
        </div>
        <div class="footer">
          <span class="mark">BS</span>
          bharathasl.github.io
        </div>
      </div>
      <img class="character" src="../../src/assets/images/character-fallback.webp" alt="" />
    </div>
  </body>
</html>
